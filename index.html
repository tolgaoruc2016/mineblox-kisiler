<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineBlox - Yaka Kartları Portalı</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; padding-bottom: 2rem; }

    header {
      background: #111827;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #38bdf8;
    }

    h1 { font-size: 1.5rem; color: #38bdf8; }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-admin { background: #ef4444; color: white; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

    .card {
      display: flex;
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.1);
    }

    .card-photo-box {
      width: 180px;
      height: 100%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid rgba(255,255,255,0.2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-photo-box img { width: 100%; height: 100%; object-fit: cover; }

    .card-info-box {
      flex: 1;
      height: 100%;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      word-break: break-word;
    }
    .card-name { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.2rem; text-transform: uppercase; }
    .card-desc { font-size: 0.85rem; opacity: 0.9; margin-bottom: 0.8rem; }
    .card-role { font-size: 1.1rem; font-weight: 800; }

    .bg-baskan { background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff; }
    .bg-videolar { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
    .bg-sponsorluk { background: linear-gradient(135deg, #eab308, #facc15); color: #1e293b; }
    .bg-discord { background: linear-gradient(135deg, #15803d, #22c55e); color: #fff; }
    .bg-diger { background: linear-gradient(135deg, #475569, #64748b); color: #fff; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-size: 0.9rem; }
    .form-group input, .form-group select {
      width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #1f2937; color: white;
    }
    .crop-preview-box { margin-top: 0.8rem; display: none; text-align: center; background: #1e293b; padding: 1rem; border-radius: 8px; }
    .crop-preview-box img { max-width: 100%; max-height: 200px; border-radius: 6px; margin-bottom: 0.5rem; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid #374151; font-size: 0.9rem; }
    
    .btn-action { padding: 0.38rem 0.6rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.78rem; font-weight: bold; }
    .btn-pdf { background: #0284c7; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-cancel { background: #64748b; color: white; }
    .btn-submit { background: #22c55e; color: white; }
    .btn-crop { background: #38bdf8; color: #0f172a; margin-top: 0.4rem; }

    #pdfRenderArea { position: absolute; left: -9999px; top: -9999px; width: 856px; height: 540px; }
    #pdfCard { width: 100%; height: 100%; border-radius: 0; border: none; }
    #pdfCard .card-photo-box { width: 540px; height: 540px; }
    #pdfCard .card-name { font-size: 3.5rem !important; }
    #pdfCard .card-desc { font-size: 1.8rem !important; margin-bottom: 1.5rem !important; }
    #pdfCard .card-role { font-size: 2.2rem !important; }
  </style>
</head>
<body>

  <header>
    <h1>MineBlox Portalı</h1>
    <button class="btn btn-admin" onclick="openLoginModal()">Admin Paneli</button>
  </header>

  <div class="container">
    <div id="cardsContainer" class="cards-grid"></div>
  </div>

  <!-- Şifre Modalı (Şifre: 2016) -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Admin Girişi</h2>
      <br>
      <div id="loginError" style="color: #ef4444; display: none; margin-bottom: 1rem;">Hatalı şifre! (Şifre: 2016)</div>
      <div class="form-group">
        <label>Admin Şifresi:</label>
        <input type="password" id="adminPasswordInput" placeholder="2016 yazın...">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-submit" onclick="verifyPassword()">Giriş Yap</button>
        <button class="btn btn-cancel" onclick="closeLoginModal()">İptal</button>
      </div>
    </div>
  </div>

  <!-- Admin Paneli -->
  <div id="adminPanelModal" class="modal">
    <div class="modal-content">
      <h2 id="formTitle">Yaka Kartı Ekle</h2>
      <br>
      <form id="cardForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editId">
        <input type="hidden" id="croppedPhotoData">
        
        <div class="form-group">
          <label>Ad Soyad *</label>
          <input type="text" id="name" required placeholder="Örn: Tolga Oruç">
        </div>

        <div class="form-group">
          <label>Rol *</label>
          <select id="role" required onchange="handleRoleChange()">
            <option value="Başkan">Başkan (Mavi)</option>
            <option value="Videolara Katılan">Videolara Katılan (Kırmızı)</option>
            <option value="Sponsorluk">Sponsorluk (Sarı)</option>
            <option value="Discord Yardımcısı">Discord Yardımcısı (Yeşil)</option>
            <option value="Diğer">Diğer (Gri)</option>
          </select>
        </div>

        <div class="form-group" id="customRoleGroup" style="display: none;">
          <label>Özel Rol Adı</label>
          <input type="text" id="customRole" placeholder="Örn: Moderatör">
        </div>

        <div class="form-group">
          <label>Açıklama</label>
          <input type="text" id="info" placeholder="Örn: Kurucu">
        </div>

        <div class="form-group">
          <label>Fotoğraf</label>
          <input type="file" id="photo" accept="image/*" onchange="handleFileSelect(event)">
          <div id="cropPreviewBox" class="crop-preview-box">
            <img id="rawImagePreview" src="" alt="Önizleme">
            <br>
            <button type="button" class="btn btn-action btn-crop" onclick="cropToSquare()">1:1 Kareye Kırp</button>
          </div>
        </div>

        <div style="display: flex; gap: 0.5rem;">
          <button type="submit" class="btn btn-submit" id="submitBtn">Ekle</button>
          <button type="button" class="btn btn-cancel" onclick="resetForm()">Temizle</button>
          <button type="button" class="btn btn-cancel" style="margin-left: auto;" onclick="closeAdminPanel()">Kapat</button>
        </div>
      </form>

      <div style="margin-top: 1.5rem; border-top: 1px solid #374151; padding-top: 1rem;">
        <h3>Kişileri Yönet</h3>
        <br>
        <div id="adminItemsList"></div>
      </div>
    </div>
  </div>

  <div id="pdfRenderArea">
    <div id="pdfCard" class="card">
      <div class="card-photo-box"><img id="pdfPhoto" src=""></div>
      <div class="card-info-box">
        <div id="pdfName" class="card-name"></div>
        <div id="pdfInfo" class="card-desc"></div>
        <div id="pdfRole" class="card-role"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "2016";
    const DEFAULT_PHOTO = "https://via.placeholder.com/150/374151/ffffff?text=FOTO";

    // Veriler otomatik olarak burada saklanır ve güncellenir
    let cards = JSON.parse(localStorage.getItem('mineblox_code_data')) || [
      { id: '1', name: 'TOLGA ORUÇ', role: 'Başkan', customRole: '', info: 'Kurucu', photo: '' }
    ];

    function saveAndRender() {
      localStorage.setItem('mineblox_code_data', JSON.stringify(cards));
      renderCards();
      renderAdminList();
    }

    function getRoleBgClass(role) {
      switch(role) {
        case 'Başkan': return 'bg-baskan';
        case 'Videolara Katılan': return 'bg-videolar';
        case 'Sponsorluk': return 'bg-sponsorluk';
        case 'Discord Yardımcısı': return 'bg-discord';
        default: return 'bg-diger';
      }
    }

    function handleRoleChange() {
      const role = document.getElementById('role').value;
      document.getElementById('customRoleGroup').style.display = (role === 'Diğer') ? 'block' : 'none';
    }

    function handleFileSelect(evt) {
      const file = evt.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('rawImagePreview').src = e.target.result;
          document.getElementById('cropPreviewBox').style.display = 'block';
          document.getElementById('croppedPhotoData').value = '';
        };
        reader.readAsDataURL(file);
      }
    }

    function cropToSquare() {
      const rawImg = document.getElementById('rawImagePreview');
      if (!rawImg.src) return;

      const img = new Image();
      img.src = rawImg.src;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const side = Math.min(img.width, img.height);
        canvas.width = side; canvas.height = side;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, side, side);
        const cropped = canvas.toDataURL('image/png');
        document.getElementById('croppedPhotoData').value = cropped;
        rawImg.src = cropped;
        alert('Fotoğraf kare yapıldı!');
      };
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';
      cards.forEach(card => {
        const displayRole = card.role === 'Diğer' && card.customRole ? card.customRole : card.role;
        container.innerHTML += `
          <div class="card ${getRoleBgClass(card.role)}">
            <div class="card-photo-box"><img src="${card.photo || DEFAULT_PHOTO}"></div>
            <div class="card-info-box">
              <div class="card-name">${card.name}</div>
              <div class="card-desc">${card.info || ''}</div>
              <div class="card-role">${displayRole}</div>
            </div>
          </div>
        `;
      });
    }

    function renderAdminList() {
      const list = document.getElementById('adminItemsList');
      list.innerHTML = '';
      cards.forEach(card => {
        list.innerHTML += `
          <div class="admin-item">
            <span><strong>${card.name}</strong></span>
            <div style="display:flex; gap:4px;">
              <button class="btn-action btn-pdf" onclick="generatePDF('${card.id}')">PDF</button>
              <button class="btn-action btn-edit" onclick="editCard('${card.id}')">Düzenle</button>
              <button class="btn-action btn-delete" onclick="deleteCard('${card.id}')">Sil</button>
            </div>
          </div>
        `;
      });
    }

    function openLoginModal() {
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('loginModal').style.display = 'flex';
    }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    function verifyPassword() {
      if (document.getElementById('adminPasswordInput').value === ADMIN_PASS) {
        closeLoginModal();
        document.getElementById('adminPanelModal').style.display = 'flex';
        renderAdminList();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }
    function closeAdminPanel() { document.getElementById('adminPanelModal').style.display = 'none'; resetForm(); }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value || Date.now().toString();
      const name = document.getElementById('name').value;
      const role = document.getElementById('role').value;
      const customRole = document.getElementById('customRole').value;
      const info = document.getElementById('info').value;
      const cropped = document.getElementById('croppedPhotoData').value;
      const fileInput = document.getElementById('photo');

      const finish = (photoUrl) => {
        const idx = cards.findIndex(c => c.id === id);
        const cardData = { id, name, role, customRole, info, photo: photoUrl !== null ? photoUrl : (idx !== -1 ? cards[idx].photo : '') };
        if (idx !== -1) cards[idx] = cardData; else cards.push(cardData);
        saveAndRender();
        resetForm();
        alert("Kişi başarıyla eklendi ve kod güncellendi!");
      };

      if (cropped) {
        finish(cropped);
      } else if (fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (evt) => finish(evt.target.result);
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finish(null);
      }
    }

    function editCard(id) {
      const c = cards.find(x => x.id === id);
      if (c) {
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('role').value = c.role;
        handleRoleChange();
        document.getElementById('customRole').value = c.customRole || '';
        document.getElementById('info').value = c.info || '';
        document.getElementById('formTitle').innerText = 'Kişi Düzenle';
        document.getElementById('submitBtn').innerText = 'Güncelle';
        if (c.photo) {
          document.getElementById('rawImagePreview').src = c.photo;
          document.getElementById('cropPreviewBox').style.display = 'block';
          document.getElementById('croppedPhotoData').value = c.photo;
        }
      }
    }

    function deleteCard(id) {
      if (confirm("Bu kişiyi silmek istiyor musun?")) {
        cards = cards.filter(c => c.id !== id);
        saveAndRender();
      }
    }

    function resetForm() {
      document.getElementById('cardForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('croppedPhotoData').value = '';
      document.getElementById('formTitle').innerText = 'Yaka Kartı Ekle';
      document.getElementById('submitBtn').innerText = 'Ekle';
      document.getElementById('cropPreviewBox').style.display = 'none';
      handleRoleChange();
    }

    async function generatePDF(id) {
      const c = cards.find(x => x.id === id);
      if (!c) return;
      document.getElementById('pdfPhoto').src = c.photo || DEFAULT_PHOTO;
      document.getElementById('pdfName').innerText = c.name;
      document.getElementById('pdfRole').innerText = c.role === 'Diğer' && c.customRole ? c.customRole : c.role;
      document.getElementById('pdfInfo').innerText = c.info || '';
      document.getElementById('pdfCard').className = `card ${getRoleBgClass(c.role)}`;

      try {
        const canvas = await html2canvas(document.getElementById('pdfRenderArea'), { scale: 3, useCORS: true });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('l', 'mm', [85.6, 54]);
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 85.6, 54);
        pdf.save(`${c.name}_YakaKarti.pdf`);
      } catch (err) { console.error(err); }
    }

    renderCards();
  </script>
</body>
</html>
